name: Test

# Guarda mecânica do repositório (decisão 4.83): as suítes de regressão e os checks de
# release rodam em todo push/PR — em Linux (portabilidade bash 3.2 + awk POSIX além do
# macOS local) e em macOS (o /bin/bash 3.2 real, que é o piso declarado — 4.389).
# O pre-commit local (scripts/git-hooks/pre-commit) roda o subconjunto afetado antes do
# commit; este workflow é a rede de segurança para o que escapar dele.
#
# As suítes NÃO são listadas aqui (4.389): scripts/tests/run-all.sh descobre toda
# scripts/tests/*/run.sh, roda todas até o fim (uma vermelha não esconde as seguintes),
# publica JUnit + logs como artefato — suíte nova entra sozinha no CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: suítes e checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bit de execução dos scripts do pacote (4.180/4.195 — 644 vira Permission denied no consumidor)
        run: |
          bad="$(git ls-files -s -- 'hooks/*.sh' 'scripts/*.sh' 'scripts/git-hooks/*' | grep -v '^100755' || true)"
          if [ -n "$bad" ]; then echo "script sem bit de execução:"; echo "$bad"; exit 1; fi

      - name: Versão do bash (o piso declarado é 3.2 — o job macOS prova com o /bin/bash do sistema)
        run: /bin/bash -c 'echo "$BASH_VERSION"'

      - name: Dependências das suítes (PyYAML antes da suíte do frontmatter — 4.385)
        run: python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml || pip3 install --quiet --break-system-packages pyyaml

      - name: shellcheck em todos os scripts (4.208 — análise estática além do bash -n; hooks do mantenedor incluídos, 4.385)
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck scripts/*.sh hooks/*.sh .claude/hooks/*.sh scripts/git-hooks/* scripts/tests/*/run.sh scripts/tests/run-all.sh

      - name: Todas as suítes mecânicas (scripts/tests/run-all.sh — descoberta automática, 4.389)
        run: /bin/bash scripts/tests/run-all.sh --junit "junit-${{ matrix.os }}.xml" --logs "suite-logs-${{ matrix.os }}"

      - name: Publicar JUnit e logs das suítes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suites-${{ matrix.os }}
          path: |
            junit-${{ matrix.os }}.xml
            suite-logs-${{ matrix.os }}/
          if-no-files-found: warn

      - name: Paridade MCP dos agents (scripts/check-agents.sh)
        run: bash scripts/check-agents.sh

      - name: Blocos mermaid da superfície da wiki (scripts/check-mermaid.sh)
        run: bash scripts/check-mermaid.sh

      - name: Frontmatter YAML de todo .md (scripts/check-frontmatter.sh)
        run: bash scripts/check-frontmatter.sh

      - name: Sincronização de comandos/agents (scripts/check-sync.sh)
        run: bash scripts/check-sync.sh

      - name: Templates canônicos dos artefatos SDD (scripts/check-templates.sh)
        run: bash scripts/check-templates.sh

      - name: Checks de release (versões · CHANGELOG · MIRRORS · bash -n)
        run: bash scripts/check-release.sh
