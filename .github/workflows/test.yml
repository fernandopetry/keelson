name: Test

# Guarda mecânica do repositório (decisão 4.83): a suíte de regressão do grafo e os
# checks de release rodam em todo push/PR — em Linux, o que também prova a
# portabilidade (bash 3.2 + awk POSIX) que a máquina local macOS não prova.
# O pre-commit local (scripts/git-hooks/pre-commit) roda o mesmo conjunto antes do
# commit; este workflow é a rede de segurança para o que escapar dele.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Suíte do grafo (scripts/tests/graph/run.sh)
        run: bash scripts/tests/graph/run.sh

      - name: Suíte do map (scripts/tests/map/run.sh)
        run: bash scripts/tests/map/run.sh

      - name: Suíte do check de agents (scripts/tests/agents-mcp/run.sh)
        run: bash scripts/tests/agents-mcp/run.sh

      - name: Paridade MCP dos agents (scripts/check-agents.sh)
        run: bash scripts/check-agents.sh

      - name: Suíte do check de sincronização (scripts/tests/sync/run.sh)
        run: bash scripts/tests/sync/run.sh

      - name: Suíte do ficha.sh (scripts/tests/ficha/run.sh)
        run: bash scripts/tests/ficha/run.sh

      - name: Suíte do next-id.sh (scripts/tests/next-id/run.sh)
        run: bash scripts/tests/next-id/run.sh

      - name: Suíte do index-check.sh (scripts/tests/index/run.sh)
        run: bash scripts/tests/index/run.sh

      - name: Suíte do diff-facts.sh (scripts/tests/diff-facts/run.sh)
        run: bash scripts/tests/diff-facts/run.sh

      - name: Suíte do artifact-lint.sh (scripts/tests/artifact-lint/run.sh)
        run: bash scripts/tests/artifact-lint/run.sh

      - name: Suíte do run-state.sh (scripts/tests/run-state/run.sh)
        run: bash scripts/tests/run-state/run.sh

      - name: Suíte do ledger.sh (scripts/tests/ledger/run.sh)
        run: bash scripts/tests/ledger/run.sh

      - name: Suíte do init-selfcheck.sh (scripts/tests/init-selfcheck/run.sh)
        run: bash scripts/tests/init-selfcheck/run.sh

      - name: Suíte do probe-env.sh (scripts/tests/probe-env/run.sh)
        run: bash scripts/tests/probe-env/run.sh

      - name: Suíte do epic-state.sh (scripts/tests/epic-state/run.sh)
        run: bash scripts/tests/epic-state/run.sh

      - name: Suíte do handoff-scan.sh (scripts/tests/handoff-scan/run.sh)
        run: bash scripts/tests/handoff-scan/run.sh

      - name: Suíte do legacy-move.sh (scripts/tests/legacy-move/run.sh)
        run: bash scripts/tests/legacy-move/run.sh

      - name: Suíte do postmortem-facts.sh (scripts/tests/postmortem-facts/run.sh)
        run: bash scripts/tests/postmortem-facts/run.sh

      - name: Suíte do edge-diff.sh (scripts/tests/edge-diff/run.sh)
        run: bash scripts/tests/edge-diff/run.sh

      - name: Sincronização de comandos/agents (scripts/check-sync.sh)
        run: bash scripts/check-sync.sh

      - name: Checks de release (versões · CHANGELOG · MIRRORS · bash -n)
        run: bash scripts/check-release.sh
