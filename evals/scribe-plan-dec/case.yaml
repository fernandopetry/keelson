# Caso nº 22 (decisão 4.422 — "DEC proporcional ao que decide") — lado do GERADOR. No
# acervo real 60% das DECs são `Aderência: herdada`, 5% irreversíveis, 18 linhas cada, 7
# por PLAN: a forma completa é paga por escolhas que a ficha já dita. Braço A = git:HEAD
# (toda DEC em forma completa); braço B = arms/DEC-PROPORCIONAL.md (DEC nova/irreversível/
# exceção em forma completa; DEC herdada em UMA linha com a fonte). Mede: a decisão real
# (síncrono × fila; onde guardar o comprovante; cliente dedicado) mantém trade-off com
# custo concreto (dec-nova-completa); o que a ficha dita (stack, controller→service→
# repository, HttpGateway, migrations) NÃO vira DEC de forma completa com alternativa
# inventada (herdada-nao-inflada); e os dois eixos de não-regressão do caso nº 16. O
# tamanho do PLAN é medido fora do runner (linhas do deck). Plant: inverte os níveis.
